# builds the app for every platform on "v*" tags and attaches the results to a github release.
#
# the apk is signed with the keystore in the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
# secrets. without them a throwaway key is generated, and android won't install the next release
# over that one.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo build --release --locked --bin bitcoin-smol --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/bitcoin-smol$ext" \
             "dist/bitcoin-smol-${GITHUB_REF_NAME}-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-apk --locked
      - name: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret, signing with a throwaway key"
            password="throwaway"
            keytool -genkeypair -keystore "$ks" -storepass "$password" -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=bitcoin smol"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "::add-mask::$password"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: build
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --lib --release
          android/package.sh target/release/apk/bitcoin-smol.apk \
            "$CARGO_APK_RELEASE_KEYSTORE" "$CARGO_APK_RELEASE_KEYSTORE_PASSWORD"
          mkdir dist
          cp target/release/apk/bitcoin-smol.apk "dist/bitcoin-smol-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
