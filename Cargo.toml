[package]
name = "bitcoin-smol"
version = "0.1.0"
edition = "2024"
description = "trust-based p2p bitcoin/fiat market over nostr"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "bitcoin-smol"
path = "src/main.rs"

# renders the screenshots in docs/static/screenshots, see src/app/screenshots.rs
[[bin]]
name = "screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshots"]

[features]
screenshots = ["slint/software-renderer-systemfonts", "dep:png"]

[dependencies]
ritualistic = { version = "0.2.3", default-features = false, features = ["redb"] }
redb = "4.3"
rkyv = "0.8.11"
slint = "1.17"
# tokio itself on native, a single-threaded stand-in on top of the browser's event loop on wasm
tokio_with_wasm = { version = "0.8.8", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
sha3 = "0.10"
sys-locale = "0.3"
webbrowser = "1.2.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = { version = "0.18", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
web-sys = { version = "0.3", features = ["Storage", "Window"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }
android_logger = "0.15"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
env_logger = "0.11"

[build-dependencies]
slint-build = "1.17"

[package.metadata.android]
package = "cash.small.bitcoin"
apk_name = "bitcoin-smol"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "bitcoin smol"
