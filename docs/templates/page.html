{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ page.title }}</h1>
{{ page.content | safe }}
{% if page.lower %}<p class="next">next: <a href="{{ page.lower.permalink }}">{{ page.lower.title }} →</a></p>{% endif %}
{% endblock %}
