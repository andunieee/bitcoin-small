[package]
name = "bitcoin-small"
version = "0.1.0"
edition = "2024"
description = "trust-based p2p bitcoin/fiat market over nostr"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "bitcoin-small"
path = "src/main.rs"

[dependencies]
ritualistic = { version = "0.2.1", default-features = false, features = ["redb"] }
rkyv = "0.8.11"
slint = "1.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
sys-locale = "0.3"
minisqlite = { git = "https://github.com/cursor/minisqlite" }
webbrowser = "1.2.4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[build-dependencies]
slint-build = "1.17"

[package.metadata.android]
package = "cash.small.bitcoin"
apk_name = "bitcoin-small"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "bitcoin small"
