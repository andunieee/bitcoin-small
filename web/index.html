<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bitcoin small</title>
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="bitcoin-small" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* slint draws the whole app into this canvas. it sets the canvas to the window's preferred
         size (a phone's) with inline styles, so this has to be !important to fill the page instead */
      #canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
</html>
